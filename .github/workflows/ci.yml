name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: runcycles/.github/.github/workflows/ci-typescript.yml@main

  recovery-conformance:
    name: Durable recovery conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runcycles/cycles-protocol
          ref: bc12e1fc4b17e272614b63d5e3cb0bea408885af
          path: .cycles-protocol
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python -m pip install PyYAML
      - name: Run shared durable recovery scenarios
        run: >-
          python .cycles-protocol/scripts/run_client_recovery_conformance.py
          --claim durable
          --report-json recovery-conformance.json
          --implementation runcycles/cycles-client-typescript
          --implementation-commit ${{ github.event.pull_request.head.sha || github.sha }}
          --evidence-url https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --adapter python scripts/recovery_conformance_adapter.py
      - name: Upload recovery conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-conformance-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery-conformance.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish to npm
    needs: [ci, recovery-conformance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Pinned to npm 11: npm 12 dropped Node 20 support (OIDC needs npm >= 11.5.1).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm publish --provenance --access public

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Mirrors the cycles-client-python release flow: GitHub auto-generates
        # the body (## What's Changed, * PR-title by @user in PR-url,
        # **Full Changelog**: compare/PREV...CUR). The author can edit the
        # release post-hoc to add a richer description if desired.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
